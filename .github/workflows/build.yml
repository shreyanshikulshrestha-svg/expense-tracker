name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create project and build APK
        run: |
          flutter create --org com.shruti expense_tracker
          cp main.dart expense_tracker/lib/main.dart
          cd expense_tracker
          flutter pub add shared_preferences
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: expense_tracker/build/app/outputs/flutter-apk/app-release.apk

      - name: Zip full project folder
        run: |
          rm -rf expense_tracker/build expense_tracker/.dart_tool
          zip -r expense_tracker_project.zip expense_tracker

      - name: Upload project source
        uses: actions/upload-artifact@v4
        with:
          name: project-source
          path: expense_tracker_project.zip
